<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Soft Sky Blue Rounded Squircle -->
  <rect width="192" height="192" rx="44" fill="#38BDF8" />
  
  <!-- Subtle decorative cloud puffs / road sparkle -->
  <circle cx="44" cy="40" r="14" fill="#FFFFFF" fill-opacity="0.35" />
  <circle cx="150" cy="46" r="18" fill="#FFFFFF" fill-opacity="0.25" />
  <circle cx="168" cy="52" r="10" fill="#FFFFFF" fill-opacity="0.2" />

  <!-- Shadow under Bus -->
  <ellipse cx="96" cy="144" rx="64" ry="8" fill="#0284C7" fill-opacity="0.4" />

  <!-- ================= BUS BODY (BRIGHT VIBRANT YELLOW) ================= -->
  <!-- Main Bus Chassis (Bright Yellow #FACC15 / #EAB308) -->
  <rect x="28" y="56" width="136" height="74" rx="20" fill="#FACC15" stroke="#EAB308" stroke-width="3" />
  <!-- Bus Roof Cap highlight -->
  <path d="M48 56 H144 C155 56 164 63 164 72 V74 H28 V72 C28 63 37 56 48 56 Z" fill="#FDE047" />

  <!-- Side Accent Stripe (Warm Amber) -->
  <rect x="28" y="96" width="136" height="6" fill="#EAB308" />

  <!-- ================= WINDOWS (BRIGHT SKY BLUE WITH WHITE REFLECTION) ================= -->
  <!-- Front Windshield -->
  <path d="M38 66 H66 V90 H38 C34 90 32 87 32 83 V72 C32 68 35 66 38 66 Z" fill="#E0F2FE" stroke="#0284C7" stroke-width="2" />
  <!-- Front Window Glare -->
  <path d="M44 68 L36 84" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Middle Window 1 -->
  <rect x="72" y="66" width="22" height="24" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="2" />
  <line x1="84" y1="69" x2="78" y2="85" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Middle Window 2 -->
  <rect x="98" y="66" width="22" height="24" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="2" />
  <line x1="110" y1="69" x2="104" y2="85" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- Rear Window -->
  <path d="M124 66 H152 C156 66 159 69 159 73 V83 C159 87 156 90 152 90 H124 V66 Z" fill="#E0F2FE" stroke="#0284C7" stroke-width="2" />
  <line x1="138" y1="69" x2="132" y2="85" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

  <!-- ================= HEADLIGHTS & GRILLE ================= -->
  <!-- Left Headlight (Shining Yellow) -->
  <circle cx="40" cy="112" r="7" fill="#FEF08A" stroke="#CA8A04" stroke-width="2" />
  <circle cx="40" cy="112" r="3.5" fill="#FFFFFF" />

  <!-- Right Headlight -->
  <circle cx="152" cy="112" r="7" fill="#FEF08A" stroke="#CA8A04" stroke-width="2" />
  <circle cx="152" cy="112" r="3.5" fill="#FFFFFF" />

  <!-- Front/Center Bumper / Grille bar -->
  <rect x="54" y="109" width="84" height="6" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- ================= WHEELS ================= -->
  <!-- Left Wheel (Slate Tyre + Silver Rim) -->
  <rect x="46" y="122" width="26" height="18" rx="6" fill="#1E293B" />
  <circle cx="59" cy="131" r="5" fill="#94A3B8" stroke="#475569" stroke-width="2" />
  <circle cx="59" cy="131" r="2" fill="#F8FAFC" />

  <!-- Right Wheel (Slate Tyre + Silver Rim) -->
  <rect x="120" y="122" width="26" height="18" rx="6" fill="#1E293B" />
  <circle cx="133" cy="131" r="5" fill="#94A3B8" stroke="#475569" stroke-width="2" />
  <circle cx="133" cy="131" r="2" fill="#F8FAFC" />

  <!-- ================= TRIP DECORATION ================= -->
  <!-- Cute Red Pennant Flag at the top -->
  <path d="M120 34 L144 42 L120 50 Z" fill="#EF4444" />
  <line x1="120" y1="34" x2="120" y2="58" stroke="#64748B" stroke-width="3" stroke-linecap="round" />

  <!-- Badge Label: 진장 수학여행 -->
  <rect x="52" y="156" width="88" height="22" rx="11" fill="#0369A1" />
  <text x="96" y="171" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="900" font-family="'Pretendard', sans-serif" letter-spacing="0.5">진장 수학여행</text>
</svg>
